<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sila's Times Tables</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff7ec; --ink:#2b2350; --muted:#7a7499; --card:#ffffff;
    --pink:#ff6fa5; --purple:#8a5cf6; --teal:#16b8a6; --yellow:#ffc93c; --red:#ff5c5c; --green:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Baloo 2",system-ui,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;justify-content:center;
    background-image:radial-gradient(circle at 10% 10%,#ffe1ef 0 80px,transparent 81px),
      radial-gradient(circle at 90% 20%,#e3f7ff 0 110px,transparent 111px),
      radial-gradient(circle at 85% 90%,#fff0c2 0 90px,transparent 91px);}
  .wrap{width:100%;max-width:620px;padding:18px 16px 40px}
  h1{font-size:32px;line-height:1.1;margin:8px 0 2px;text-align:center}
  h1 span{color:var(--pink)}
  h2{font-size:20px;margin:18px 4px 10px}
  .sub{text-align:center;color:var(--muted);margin:0 0 16px;font-size:17px}
  .card{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 8px 0 #eadff7,0 12px 30px rgba(60,40,120,.08)}

  /* home grid */
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  @media (max-width:430px){.grid{grid-template-columns:repeat(3,1fr)}}
  .tbtn{border:none;border-radius:22px;padding:14px 4px 10px;font:inherit;color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
  .tbtn:active{transform:translateY(3px)}
  .tbtn .x{font-size:34px;font-weight:800;line-height:1}
  .tbtn .lbl{font-size:13px;opacity:.95}
  .tbtn .st{font-size:12px;background:rgba(255,255,255,.28);border-radius:10px;padding:0 8px;margin-top:4px}
  .mix{display:grid;gap:12px}
  .mbtn{display:flex;align-items:center;gap:14px;border:none;border-radius:22px;padding:14px 18px;font:inherit;color:#fff;
    cursor:pointer;text-align:left;transition:transform .1s}
  .mbtn:active{transform:translateY(3px)}
  .mbtn .ic{font-size:34px;line-height:1}
  .mbtn .t{flex:1;font-size:21px;font-weight:800;line-height:1.1}
  .mbtn .t small{display:block;font-weight:500;font-size:14px;opacity:.95}
  .mbtn .st{font-size:13px;background:rgba(255,255,255,.28);border-radius:10px;padding:0 8px}

  /* level list */
  .levels{display:grid;gap:10px}
  .lvl{display:flex;align-items:center;gap:12px;border:none;border-radius:18px;padding:12px 14px;
    font:inherit;font-size:18px;color:var(--ink);background:#f4f0ff;cursor:pointer;text-align:left}
  .lvl:hover{background:#ebe4ff}
  .lvl .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
  .lvl .t{flex:1;line-height:1.15}
  .lvl .t small{display:block;color:var(--muted);font-size:14px}
  .lvl .stars{font-size:16px;letter-spacing:1px}
  .big{display:block;width:100%;border:none;border-radius:20px;padding:16px;font:inherit;font-weight:800;font-size:22px;
    color:#fff;background:var(--pink);box-shadow:0 6px 0 #d94d84;cursor:pointer;margin-top:14px}
  .big:active{transform:translateY(3px);box-shadow:0 3px 0 #d94d84}
  .big.alt{background:var(--purple);box-shadow:0 6px 0 #6a3fd6}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:16px;color:var(--muted);gap:8px}
  .home{border:none;background:#f4f0ff;color:var(--ink);font:inherit;border-radius:12px;padding:4px 12px;cursor:pointer;white-space:nowrap}
  .bar{height:14px;background:#f1ecfb;border-radius:10px;overflow:hidden;margin-bottom:16px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--purple));border-radius:10px;transition:width .3s}
  .tag{display:inline-block;padding:2px 12px;border-radius:20px;color:#fff;font-size:15px;font-weight:700}

  /* question */
  .q{font-size:46px;font-weight:800;text-align:center;margin:18px 0 6px;line-height:1.15}
  .q.word{font-size:22px;font-weight:700;text-align:left;line-height:1.35}
  .q .blank{display:inline-block;min-width:60px;border-bottom:5px dashed var(--yellow);color:var(--purple)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .opt{border:none;border-radius:22px;padding:20px 8px;font:inherit;font-size:40px;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s}
  .opt:nth-child(1){background:var(--teal);box-shadow:0 7px 0 #0f8e80}
  .opt:nth-child(2){background:var(--purple);box-shadow:0 7px 0 #6a3fd6}
  .opt:active{transform:translateY(3px)}
  .opt.right{background:var(--green)!important;box-shadow:0 7px 0 #169a48!important}
  .opt.wrong{background:var(--red)!important;box-shadow:0 7px 0 #d23c3c!important;opacity:.85}
  .opt:disabled{cursor:default}
  .fb{min-height:34px;text-align:center;font-size:21px;font-weight:700;margin-top:14px}
  .fb.good{color:var(--green)} .fb.bad{color:var(--red)}
  .hintbtn{display:block;margin:10px auto 0;border:2px dashed #d6cbf5;background:none;color:var(--purple);font:inherit;
    font-size:16px;border-radius:14px;padding:4px 14px;cursor:pointer}
  .dots{display:none;margin:12px auto 0;width:max-content;max-width:100%;padding:10px 12px;background:#fffbea;border-radius:16px}
  .dots.show{display:block}
  .row{display:flex;gap:4px;margin:3px 0;align-items:center}
  .row b{width:12px;height:12px;border-radius:50%;background:var(--yellow);display:inline-block}
  .row em{font-style:normal;font-size:13px;color:var(--muted);margin-left:6px;min-width:22px}
  .dots p{margin:6px 0 0;font-size:15px;color:var(--muted);text-align:center}

  .end{text-align:center}
  .end .trophy{font-size:70px;line-height:1}
  .end .score{font-size:44px;font-weight:800;margin:4px 0}
  .end .bigstars{font-size:40px;letter-spacing:4px}
  .review{text-align:left;background:#fff3f3;border-radius:16px;padding:10px 14px;margin-top:12px;font-size:18px}
  .review div{padding:2px 0}
  .pop{animation:pop .35s}
  @keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .confetti{position:fixed;top:-20px;font-size:26px;pointer-events:none;animation:fall 1.6s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const NAME = "Sila";
const COLORS = ["#16b8a6","#3b82f6","#8a5cf6","#ff6fa5","#f59e0b","#ef4444","#0ea5e9","#a855f7","#10b981","#f97316"];
const SHADOWS = ["#0f8e80","#2563c9","#6a3fd6","#d94d84","#c27c07","#c53030","#0b7fb5","#8636c9","#0a8a60","#c95a0e"];
const rand = n => Math.floor(Math.random()*n);
const pickFrom = a => a[rand(a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]} return a; };
const range = (a,b) => Array.from({length:b-a+1},(_,i)=>a+i);

/* wrong answer: close but not equal, never 0 or negative */
function near(ans, step){
  const c = [ans+step, ans-step, ans+1, ans-1].filter(x => x>0 && x!==ans);
  return pickFrom(c);
}

/* ---------- question builders (t = table, n = multiplier) ---------- */
const mul  = (t,n) => ({ text:`${t} × ${n} = ?`, ans:t*n, wrong:near(t*n, t), dots:{t, rows:n} });
const mulR = (t,n) => ({ text:`${n} × ${t} = ?`, ans:t*n, wrong:near(t*n, t), dots:{t, rows:n} });
const miss = (t,n) => ({ html:`${t} × <span class="blank">?</span> = ${t*n}`, ans:n, wrong:near(n,1), dots:{t, rows:n, missing:true} });
const div  = (t,n) => ({ text:`${t*n} ÷ ${t} = ?`, ans:n, wrong:near(n,1), dots:{t, rows:n, div:true} });
const divMissA = (t,n) => ({ html:`<span class="blank">?</span> ÷ ${t} = ${n}`, ans:t*n, wrong:near(t*n,t), dots:{t, rows:n, div:true} });
const divMissB = (t,n) => ({ html:`${t*n} ÷ <span class="blank">?</span> = ${n}`, ans:t, wrong:near(t,1), dots:{t, rows:n, div:true} });

const WORDS = [
  (t,n)=>({ word:true, text:`${NAME} has ${t*n} stickers. She shares them equally between ${t} friends. How many stickers does each friend get?`, ans:n, wrong:near(n,1), dots:{t, rows:n, div:true} }),
  (t,n)=>({ word:true, text:`There are ${n} boxes. Each box has ${t} cupcakes. How many cupcakes are there in total?`, ans:t*n, wrong:near(t*n,t), dots:{t, rows:n} }),
  (t,n)=>({ word:true, text:`A teacher puts ${t*n} pencils into groups of ${t}. How many groups are there?`, ans:n, wrong:near(n,1), dots:{t, rows:n, div:true} }),
  (t,n)=>({ word:true, text:`${NAME} buys ${n} bags of apples. Each bag has ${t} apples. How many apples does she have?`, ans:t*n, wrong:near(t*n,t), dots:{t, rows:n} }),
  (t,n)=>({ word:true, text:`${t*n} children sit in rows. There are ${t} children in each row. How many rows are there?`, ans:n, wrong:near(n,1), dots:{t, rows:n, div:true} }),
  (t,n)=>({ word:true, text:`Each star sticker costs ${t} riyals. How much do ${n} stickers cost?`, ans:t*n, wrong:near(t*n,t), dots:{t, rows:n} })
];

/* ---------- one table: easy → hard → division ---------- */
function tableLevels(t){
  return [
    { title:"Warm Up", note:`${t} × 1 to ${t} × 5, in order`, make:()=>range(1,5).map(n=>mul(t,n)) },
    { title:"Keep Climbing", note:`${t} × 6 to ${t} × 10, in order`, make:()=>range(6,10).map(n=>mul(t,n)) },
    { title:"Mix It Up", note:`${t} × 1 to ${t} × 10, any order`, make:()=>shuffle(range(1,10)).slice(0,8).map(n=>mul(t,n)) },
    { title:"Turn It Around", note:`n × ${t} and the missing number`, make:()=>shuffle([
        ...shuffle(range(2,10)).slice(0,4).map(n=>mulR(t,n)),
        ...shuffle(range(2,10)).slice(0,4).map(n=>miss(t,n)) ]) },
    { title:"Division Begins", note:`÷ ${t}, step by step`, make:()=>range(1,6).map(n=>div(t,n)) },
    { title:"Division Mix", note:`÷ ${t} in any order`, make:()=>shuffle(range(1,10)).slice(0,8).map(n=>div(t,n)) },
    { title:"Super Challenge", note:"Missing numbers & word problems", make:()=>{
        const ns = shuffle(range(3,9));
        return [ divMissA(t,ns[0]), divMissB(t,ns[1]), ...shuffle(WORDS).slice(0,4).map((w,i)=>w(t,ns[i+2])) ];
    }}
  ];
}

/* ---------- mixed sets ---------- */
function mixedLevels(a,b){
  const T = () => a + rand(b-a+1);
  const N = () => 1 + rand(10);
  return [
    { title:"Times Mix", note:`× from the ${a}–${b} tables`, make:()=>range(1,10).map(()=>{ const t=T(),n=N(); return rand(2)?mul(t,n):mulR(t,n); }) },
    { title:"Missing Number", note:"Find the hidden number", make:()=>range(1,8).map(()=>miss(T(),2+rand(9))) },
    { title:"Division Mix", note:`÷ by ${a} to ${b}`, make:()=>range(1,10).map(()=>div(T(),N())) },
    { title:"Super Challenge", note:"Tricky ÷ and word problems", make:()=>[
        divMissA(T(),2+rand(8)), divMissB(T(),2+rand(8)),
        ...shuffle(WORDS).slice(0,4).map(w=>w(T(),2+rand(8))) ] }
  ];
}

/* ---------- sets shown on the home page ---------- */
const SETS = {};
range(1,10).forEach(t => SETS["t"+t] = { name:`${t} Times Table`, short:`× ${t}`, color:t-1, levels:tableLevels(t) });
SETS.mix15  = { name:"Tables 1 to 5", icon:"🌈", color:0, levels:mixedLevels(1,5) };
SETS.mix610 = { name:"Tables 6 to 10", icon:"🚀", color:2, levels:mixedLevels(6,10) };
SETS.all    = { name:"All the Tables", icon:"👑", color:3, levels:mixedLevels(1,10) };

/* ---------- stars (this browser only) ---------- */
const KEY = "silaTablesStars";
function loadStars(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function saveStars(set,i,s){ try{ const o=loadStars(), k=set+"-"+i; if(!o[k]||s>o[k]){o[k]=s; localStorage.setItem(KEY,JSON.stringify(o));} }catch(e){} }
function setStars(set){ const o=loadStars(); return SETS[set].levels.reduce((a,_,i)=>a+(o[set+"-"+i]||0),0); }

/* ---------- sound ---------- */
let ac;
function beep(good){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    (good?[660,880]:[260,200]).forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=good?"triangle":"sine"; o.frequency.value=f;
      g.gain.setValueAtTime(.18, ac.currentTime+i*.12);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime+i*.12+.2);
      o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+i*.12); o.stop(ac.currentTime+i*.12+.22);
    });
  }catch(e){}
}

const app = document.getElementById("app");
let state = {};
const PRAISE = [`Great job, ${NAME}! 🌟`,`Super, ${NAME}! 🎉`,"You got it! 💪","Amazing! ⭐","Brilliant! 🦄","Well done! 🌈"];

/* ---------- screens ---------- */
function home(){
  if(location.hash) history.replaceState(null,"",location.pathname);
  app.innerHTML = `
    <h1>${NAME}'s <span>Times Tables</span></h1>
    <p class="sub">Pick a table and climb from easy to division! 🚀</p>
    <div class="card">
      <div class="grid">
        ${range(1,10).map(t=>{ const k="t"+t, max=SETS[k].levels.length*3;
          return `<button class="tbtn" data-set="${k}" style="background:${COLORS[t-1]};box-shadow:0 6px 0 ${SHADOWS[t-1]}">
            <span class="x">× ${t}</span><span class="lbl">Table of ${t}</span><span class="st">⭐ ${setStars(k)}/${max}</span></button>`; }).join("")}
      </div>
    </div>
    <h2>Mixed Practice</h2>
    <div class="mix">
      ${["mix15","mix610","all"].map(k=>{ const S=SETS[k], max=S.levels.length*3;
        return `<button class="mbtn" data-set="${k}" style="background:${COLORS[S.color]};box-shadow:0 6px 0 ${SHADOWS[S.color]}">
          <span class="ic">${S.icon}</span>
          <span class="t">${S.name}<small>× · missing numbers · ÷ · word problems</small></span>
          <span class="st">⭐ ${setStars(k)}/${max}</span></button>`; }).join("")}
    </div>`;
  app.querySelectorAll("[data-set]").forEach(b => b.onclick = () => levelsPage(b.dataset.set));
}

function levelsPage(set){
  const S = SETS[set], st = loadStars();
  history.replaceState(null,"","#"+set);
  app.innerHTML = `
    <div class="top"><button class="home" id="home">🏠 Home</button><span></span></div>
    <h1 style="margin-bottom:12px">${S.short ? `The <span>${S.short}</span> Table` : `<span>${S.name}</span>`}</h1>
    <div class="card">
      <div class="levels">
        ${S.levels.map((L,i)=>`
          <button class="lvl" data-i="${i}">
            <span class="n" style="background:${COLORS[(S.color+i)%COLORS.length]}">${i+1}</span>
            <span class="t">${L.title}<small>${L.note}</small></span>
            <span class="stars">${st[set+"-"+i] ? "⭐".repeat(st[set+"-"+i]) + "☆".repeat(3-st[set+"-"+i]) : "☆☆☆"}</span>
          </button>`).join("")}
      </div>
      <button class="big" id="all">Play all levels ▶</button>
    </div>`;
  document.getElementById("home").onclick = home;
  app.querySelectorAll(".lvl").forEach(b => b.onclick = () => start(set, +b.dataset.i, false));
  document.getElementById("all").onclick = () => start(set, 0, true);
}

function start(set, i, chain){
  const qs = SETS[set].levels[i].make().map(q => ({...q, opts: shuffle([q.ans, q.wrong])}));
  state = { set, lvl:i, chain, qs, k:0, score:0, missed:[], firstTry:true };
  ask();
}

function dotsHTML(d){
  let h = "";
  for(let r=0;r<d.rows;r++) h += `<div class="row">${"<b></b>".repeat(d.t)}<em>${(r+1)*d.t}</em></div>`;
  const msg = d.div ? `${d.rows*d.t} dots in rows of ${d.t} → count the rows!`
            : d.missing ? `How many rows of ${d.t} make ${d.rows*d.t}?`
            : `${d.rows} rows of ${d.t} — count by ${d.t}s!`;
  return h + `<p>${msg}</p>`;
}

function ask(){
  const s = state, q = s.qs[s.k], S = SETS[s.set], L = S.levels[s.lvl];
  s.firstTry = true;
  app.innerHTML = `
    <div class="top">
      <button class="home" id="back">⬅ ${S.short || S.name}</button>
      <span>Level ${s.lvl+1} · ${s.k+1} of ${s.qs.length}</span>
    </div>
    <div class="bar"><i style="width:${(s.k/s.qs.length)*100}%"></i></div>
    <div class="card pop" id="card">
      <span class="tag" style="background:${COLORS[(S.color+s.lvl)%COLORS.length]}">${L.title}</span>
      <div class="q ${q.word?"word":""}">${q.html || q.text}</div>
      <div class="opts">${q.opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>
      <button class="hintbtn" id="hint">💡 Show me a picture</button>
      <div class="dots" id="dots">${dotsHTML(q.dots)}</div>
    </div>`;
  document.getElementById("back").onclick = () => levelsPage(s.set);
  document.getElementById("hint").onclick = () => document.getElementById("dots").classList.toggle("show");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(b, q));
}

function pick(btn, q){
  const s = state, fb = document.getElementById("fb"), card = document.getElementById("card");
  if(+btn.dataset.v === q.ans){
    btn.classList.add("right");
    app.querySelectorAll(".opt").forEach(b => b.disabled = true);
    if(s.firstTry) s.score++;
    fb.className = "fb good"; fb.textContent = pickFrom(PRAISE);
    beep(true);
    setTimeout(()=>{ s.k++; s.k < s.qs.length ? ask() : finish(); }, 1000);
  } else {
    btn.classList.add("wrong"); btn.disabled = true;
    if(s.firstTry){ s.missed.push(q); s.firstTry = false; }
    fb.className = "fb bad"; fb.textContent = "Oops! Try the other one 😊";
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    document.getElementById("dots").classList.add("show");
    beep(false);
  }
}

function confetti(){
  const e = ["⭐","🎉","🌈","💖","✨","🦄"];
  for(let i=0;i<24;i++){
    const d=document.createElement("div"); d.className="confetti";
    d.textContent=pickFrom(e); d.style.left=rand(100)+"vw"; d.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),2400);
  }
}

function finish(){
  const s = state, S = SETS[s.set], n = s.qs.length, pct = s.score/n;
  const stars = pct===1 ? 3 : pct>=.75 ? 2 : pct>=.5 ? 1 : 0;
  if(!s.retry) saveStars(s.set, s.lvl, stars);
  if(stars>=2) confetti();
  const last = s.lvl === S.levels.length-1;
  const msg = stars===3 ? `Perfect, ${NAME}! You're a times table star!` :
              stars===2 ? `Great work, ${NAME}! Almost perfect!` :
              stars===1 ? `Good try, ${NAME}! Let's practise a bit more.` :
                          `Keep going, ${NAME}! Practice makes perfect 💪`;
  const fmt = q => q.html ? q.html.replace(/<[^>]+>/g,"").replace("?","__") + `  →  ${q.ans}`
                 : q.word ? q.text + `  →  ${q.ans}` : q.text.replace("?", q.ans);
  const nextLabel = s.chain && !last ? "Next level ▶" : "Play again 🔄";
  app.innerHTML = `
    <div class="top"><button class="home" id="back">⬅ ${S.short || S.name}</button><span>Level ${s.lvl+1} done!</span></div>
    <div class="bar"><i style="width:100%"></i></div>
    <div class="card end pop">
      <div class="trophy">${stars===3?"🏆":stars>=1?"🎖️":"🌱"}</div>
      <div class="score">${s.score} / ${n}</div>
      <div class="bigstars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <p style="font-size:20px;margin:8px 0 0">${msg}</p>
      ${s.missed.length ? `<div class="review"><b>Let's remember these:</b>${s.missed.map(q=>`<div>• ${fmt(q)}</div>`).join("")}</div>
        <button class="big alt" id="retry">Practise the tricky ones 🔁</button>` : ""}
      <button class="big" id="again">${nextLabel}</button>
      <button class="big alt" id="homeBtn" style="background:#2b2350;box-shadow:0 6px 0 #14102a">🏠 All tables</button>
    </div>`;
  document.getElementById("back").onclick = () => levelsPage(s.set);
  document.getElementById("homeBtn").onclick = home;
  if(s.missed.length) document.getElementById("retry").onclick = () => {
    const qs = shuffle(s.missed).map(q => ({...q, opts: shuffle([q.ans, q.wrong])}));
    state = { set:s.set, lvl:s.lvl, chain:false, retry:true, qs, k:0, score:0, missed:[], firstTry:true };
    ask();
  };
  document.getElementById("again").onclick = () => s.chain && !last ? start(s.set, s.lvl+1, true) : start(s.set, s.lvl, false);
}

/* open a set directly from the link, e.g. .../#t7 or #all */
const h = location.hash.slice(1);
SETS[h] ? levelsPage(h) : home();
</script>
</body>
</html>
